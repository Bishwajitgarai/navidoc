[project]
name = "navidoc"
version = "0.1.2"
description = "A lightweight, completely local, zero-API, tree-based RAG framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.6.2",
    "pypdf>=6.11.0",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.uv.workspace]
members = [
    "test_install",
]
